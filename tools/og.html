<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Oswald;font-weight:500;src:url(../static/assets/fonts/oswald-cyrillic-500-normal.woff2);unicode-range:U+0400-045F}@font-face{font-family:Oswald;font-weight:500;src:url(../static/assets/fonts/oswald-latin-500-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:Literata;font-weight:200 900;src:url(../static/assets/fonts/literata-cyrillic-wght-normal.woff2)}
:root{--paper:oklch(73% 0.068 70);--ink:oklch(29% 0.095 262);--accent:oklch(70% 0.2 45);--copy:oklch(97% 0.008 90)}
body{margin:0;width:1200px;height:630px;background:var(--paper);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:40px;padding:0 72px;box-sizing:border-box;font-family:Literata,serif;color:var(--ink)}
img{width:100%}
.s{background:var(--accent);padding:44px 40px;rotate:2deg;box-shadow:0 14px 30px oklch(22% 0.06 262/.26),5px 5px 0 var(--ink)}
.s b{display:block;font:500 64px/1 Oswald,sans-serif;text-transform:uppercase}
.s span{display:block;margin-top:18px;font-size:26px;font-weight:500;line-height:1.3}
</style></head><body><img src="../static/assets/logo.svg" alt=""><div class="s"><b>Как я сюда добрался?</b><span>Дорожные конфузы, новости в пути и юмор со всего мира. Каждый день.</span></div></body></html>
