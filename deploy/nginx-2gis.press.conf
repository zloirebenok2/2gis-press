server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 2gis.press www.2gis.press _;
    root /var/www/pshy/public;
    index index.html;
    charset utf-8;

    if ($host = www.2gis.press) { return 301 $scheme://2gis.press$request_uri; }

    location / { try_files $uri $uri/ =404; }
    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/xml application/rss+xml image/svg+xml text/plain;
}
